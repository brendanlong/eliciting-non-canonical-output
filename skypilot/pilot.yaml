# Pilot: one checkpoint, ~50 filtered DAPO prompts, both sampling arms.
#
#   sky launch -c noncanon-pilot skypilot/pilot.yaml -i 20 --down -y -d --env HF_TOKEN
#   sky logs noncanon-pilot
#   rsync -avz noncanon-pilot:~/sky_workdir/out/ out/     # before autodown
#
# Override MODEL / REVISION / PROMPTS / RUN_NAME with --env to reuse for any
# checkpoint. Results are uploaded to the HF dataset as they complete.

resources:
  infra: runpod
  accelerators: {H100:1, A100-80GB:1}
  disk_size: 100

workdir: .

envs:
  HF_TOKEN: null
  HF_HUB_ENABLE_HF_TRANSFER: "0"   # RunPod images set this without installing hf_transfer
  MODEL: allenai/Olmo-3-7B-Think
  REVISION: main
  PROMPTS: prompts/dapo_pilot50.jsonl
  RUN_NAME: pilot
  ARMS: untruncated
  MAX_TOKENS: "32768"
  HF_DATASET: brendanlong/noncanonical-post-training

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  # vllm==0.11 pins torch 2.8.0, whose PyPI build is CUDA 12.8 — the newest
  # build the driver-570 RunPod fleet accepts. Newer vLLM pulls CUDA 13 torch.
  uv sync --frozen --extra gpu
  uv run --no-sync python -m noncanon.gpu_check

run: |
  export PATH="$HOME/.local/bin:$PATH"
  export UV_NO_SYNC=1
  nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
  uv run python -m noncanon.gpu_check || exit 1
  set -e
  OUT=out/$RUN_NAME
  mkdir -p "$OUT"
  uv run python -m noncanon.generate --model "$MODEL" --revision "$REVISION" \
      --prompts "$PROMPTS" --arms "$ARMS" --max-tokens "$MAX_TOKENS" --out-dir "$OUT"
  uv run python -m noncanon.metrics --tokenizer "$MODEL" --revision "$REVISION" \
      --records "$OUT"/*.jsonl.gz --out-dir "$OUT/metrics"
  uv run python -m noncanon.upload "$OUT" "$RUN_NAME" --repo "$HF_DATASET"
