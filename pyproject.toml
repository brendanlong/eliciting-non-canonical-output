[project]
name = "noncanon"
version = "0.1.0"
description = "Non-canonical token output across post-training stages"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.30",
    "transformers>=4.57,<5",
    "pyarrow>=15",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = ["vllm==0.11.*"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]
